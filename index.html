<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DialRadio</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#e8ebf5" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>DialRadio</h1>
    </header>

    <div id="controls">
      <input id="search" type="search" placeholder="채널 검색" />

      <div id="country-filter" class="chip-row"></div>

      <nav class="tabs">
        <button data-tab="list" class="active">전체</button>
        <button data-tab="favorites">즐겨찾기</button>
      </nav>
    </div>

    <div id="list-scroll">
      <ul id="station-list"></ul>
    </div>
  </div>

  <footer id="player-bar">
    <div id="player-info">
      <span id="player-station-name">재생 중인 채널 없음</span>
      <span id="player-status"></span>
    </div>
    <button id="play-pause-btn" aria-label="재생/정지">
      <svg id="play-pause-icon" viewBox="0 0 24 24" width="18" height="18"><polygon points="6,4 20,12 6,20" /></svg>
    </button>
  </footer>

  <audio id="audio"></audio>

  <script src="app.js"></script>
</body>
</html>
